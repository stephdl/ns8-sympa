user nginx;
worker_processes 2;
error_log stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    client_max_body_size 100m;

    server {
        listen 8080 default_server;
        server_name _;
        # Redirect with a relative Location, the public port is the Traefik one
        absolute_redirect off;

        location = / {
            return 302 /sympa;
        }

        location /sympa {
            include /etc/nginx/fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(/sympa)(.*)$;
            fastcgi_param SCRIPT_FILENAME /usr/libexec/sympa/wwsympa.fcgi;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            # Traefik terminates TLS: tell wwsympa the request was HTTPS
            fastcgi_param HTTPS on;
            # wwsympa picks the list domain by comparing SERVER_NAME with wwsympa_url
            fastcgi_param SERVER_NAME $host;
            fastcgi_param SERVER_PORT 443;
            fastcgi_read_timeout 300;
        }

        location /static-sympa/css {
            alias /var/lib/sympa/css;
        }

        location /static-sympa/pictures {
            alias /var/lib/sympa/pictures;
        }

        location /static-sympa {
            alias /usr/share/sympa/static_content;
        }
    }
}
